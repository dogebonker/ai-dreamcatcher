[package]
name = "ai-dreamcatcher"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"

[[bin]]
name = "dreamcatcher"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
uninlined_format_args = "warn"
semicolon_if_nothing_returned = "warn"
implicit_clone = "warn"
dbg_macro = "warn"
todo = "warn"

[features]
# Live model calls: `cargo test --features live --test acceptance ac3 -- --nocapture`.
live = []
